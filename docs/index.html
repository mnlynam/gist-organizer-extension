<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Gist Organizer &mdash; a Chrome extension that turns GitHub Gist into a project-based file explorer.">
  <title>Gist Organizer</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
                   Ubuntu, Cantarell, sans-serif;
      max-width: 560px;
      margin: 96px auto;
      padding: 0 24px;
      line-height: 1.6;
      color: #1f2328;
      background: #ffffff;
    }
    h1 { margin: 0 0 0.25em; }
    p { margin: 0.75em 0; }
    ul { padding-left: 1.4em; }
    a { color: #0969da; text-decoration: none; }
    a:hover { text-decoration: underline; }
    @media (prefers-color-scheme: dark) {
      body { color: #e6edf3; background: #0d1117; }
      a { color: #2f81f7; }
    }
  </style>
</head>
<body>
  <h1>Gist Organizer</h1>
  <p>
    A Chrome extension that replaces the flat GitHub Gist list with a
    project-based file explorer and syntax-highlighted editor.
  </p>
  <ul>
    <li><a href="https://github.com/mnlynam/gist-organizer-extension">Source code on GitHub</a></li>
    <li><a href="./privacy/">Privacy policy</a></li>
  </ul>
</body>
</html>
